# Example override to run the server with the Claude Code CLI (the `claude-cli`
# provider), reusing your host Claude Code / Gemini CLI logins.
#
#   docker compose -f docker-compose.yml -f docker-compose.claude.yml up -d --build
#
# (Passing explicit -f files means docker-compose.override.yml is NOT auto-loaded,
# so this file also sets the data mount.) Requires a Claude Code login on the host
# (~/.claude) OR THAIM_ANTHROPIC_API_KEY in the environment. See
# docs/server-credentials.md. THAIM_SERVER_TOKEN is still required by the base file.
services:
  thaimaturgy:
    image: thaimaturgy-server-claude
    build:
      context: .
      dockerfile: Dockerfile.claude-cli
    # NATIVE LINUX ONLY: bind mounts keep host ownership, but the image runs as the
    # `node` user (UID 1000). If your host user isn't 1000, the mounted data dir
    # won't be writable and the ~/.claude login won't be readable. Uncomment and
    # export your ids first (`export UID; export GID=$(id -g)`) so the container
    # runs as you. Not needed on Docker Desktop (macOS/Windows).
    # user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Drive the game through your Claude Code login/subscription. You can also
      # leave this unset and pick the provider in Settings.
      THAIM_PROVIDER: ${THAIM_PROVIDER:-claude-cli}
      # Fallback when you DON'T mount a ~/.claude login: the claude CLI reads
      # ANTHROPIC_API_KEY. Populated from ANTHROPIC_API_KEY, or from
      # THAIM_ANTHROPIC_API_KEY (the name the base compose file documents), so
      # either works. Harmless if both are empty.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${THAIM_ANTHROPIC_API_KEY:-}}
    # Replace (not merge) the base file's named-volume mount.
    volumes: !override
      - ${HOME}/.thaimaturgy:/data # your adventures/sessions/config
      - ${HOME}/.claude:/home/node/.claude # reuse your Claude Code login (read-write: the CLI refreshes its token)
      # Optional: reuse a Gemini CLI login for the `gemini` provider. Uncomment
      # only if ~/.gemini exists on the host.
      # - ${HOME}/.gemini:/home/node/.gemini:ro
