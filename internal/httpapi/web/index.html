<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thAImaturgy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>thAImaturgy</h1>
    <nav>
      <button data-view="library" class="nav active">Library</button>
      <button data-view="roster" class="nav">Roster</button>
      <button data-view="settings" class="nav">Settings</button>
    </nav>
    <div class="token">
      <input id="token" type="password" placeholder="server token (if required)" autocomplete="off">
    </div>
  </header>

  <main>
    <!-- Library -->
    <section id="view-library" class="view">
      <h2>Adventures</h2>
      <div id="adventures" class="list"></div>
      <h2>Sessions</h2>
      <div id="sessions" class="list"></div>
    </section>

    <!-- Session -->
    <section id="view-session" class="view hidden">
      <div class="session-head">
        <button id="back">← Library</button>
        <span id="session-name" class="pill"></span>
        <span id="session-loc" class="muted"></span>
        <span class="spacer"></span>
        <button id="mode-toggle" class="ghost" title="Toggle Oracle ↔ Virtual DM">Mode: Oracle</button>
        <button id="begin" class="hidden" title="Start the game — the DM narrates the opening">Begin</button>
        <button id="rest" class="hidden" title="Short or long rest for the party">Rest</button>
        <button id="dice" class="ghost" title="Roll dice">🎲 Dice</button>
        <button id="save">Save</button>
        <button id="close">Close</button>
      </div>
      <div class="session-body three">
        <!-- Left: adventure browser (oracle) / party (DM) + session log -->
        <div class="col side">
          <div id="browser-wrap">
            <h3 id="browser-title">Adventure</h3>
            <div id="browser" class="tree"></div>
          </div>
          <div id="party-wrap" class="hidden">
            <div class="panel-head">
              <h3>Party</h3><span class="spacer"></span>
              <button id="party-edit" class="ghost small">Party…</button>
            </div>
            <div id="party" class="list small"></div>
          </div>
          <h3 class="logtitle">Session log</h3>
          <div id="log" class="log"></div>
        </div>

        <!-- Center: transcript + input -->
        <div class="col grow">
          <h3 id="transcript-title">Oracle</h3>
          <div id="transcript" class="transcript"></div>
          <form id="ask">
            <textarea id="ask-input" rows="3" placeholder="Ask the oracle, or type a /command. Enter sends · Shift/Ctrl+Enter = newline" autocomplete="off"></textarea>
            <button type="submit">Send</button>
          </form>
        </div>

        <!-- Right: detail pane -->
        <div id="detail-wrap" class="col detail">
          <h3 id="detail-title">Detail</h3>
          <div id="detail" class="detail-body"><p class="muted">Select something in the browser.</p></div>
        </div>
      </div>
    </section>

    <!-- Roster -->
    <section id="view-roster" class="view hidden">
      <h2>Campaign roster</h2>
      <form id="roster-add" class="row">
        <input id="rc-name" placeholder="Name" required>
        <input id="rc-race" placeholder="Race" value="Human">
        <input id="rc-class" placeholder="Class" value="Fighter">
        <button type="submit">Quick add</button>
        <button type="button" id="roster-new-full" class="ghost">New character…</button>
      </form>
      <div id="roster" class="list"></div>
    </section>

    <!-- Settings -->
    <section id="view-settings" class="view hidden">
      <h2>Settings</h2>
      <form id="settings-form" class="settings">
        <label>Provider <input id="cfg-provider"></label>
        <label>Model <input id="cfg-model"></label>
        <label>UI language <input id="cfg-language"></label>
        <button type="submit">Save settings</button>
      </form>
      <p class="muted">Secrets (API keys, Telegram token) are managed server-side and not shown here.</p>
    </section>
  </main>

  <!-- Dice roller modal -->
  <div id="dice-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span>Dice roller</span><button id="dice-close" class="ghost">✕</button></div>
      <div id="dice-quick" class="dice-quick"></div>
      <form id="dice-form" class="row">
        <input id="dice-notation" placeholder="e.g. 2d6+3" autocomplete="off">
        <button type="submit">Roll</button>
      </form>
      <div id="dice-result" class="dice-result muted"></div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <script src="/app.js"></script>
</body>
</html>
