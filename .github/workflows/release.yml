name: Release

# Publishes versioned artifacts on a semver tag push (vX.Y.Z):
#   - static binaries (server, bot, novel) for linux/darwin/windows × amd64/arm64,
#     attached to a GitHub Release with SHA-256 checksums;
#   - the desktop GUI (CGO/Fyne) for linux + macOS, built on native runners;
#   - multi-arch Docker images (default + claude-cli) pushed to GHCR.
#
# The version is taken from the tag (e.g. v1.2.3). Everyday testing lives in
# ci.yml; this workflow only runs for tags. Trigger a release with:
#   git tag v1.2.3 && git push origin v1.2.3
#
# NOTE: the Windows desktop GUI is not built here yet (Fyne needs a mingw toolchain
# on the Windows runner); Windows users get the static server/bot/novel binaries.
# A Windows GUI build (fyne-cross or a mingw setup) can follow.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'

jobs:
  # --- static CLI/server binaries (cross-compiled, CGO-free) ---------------
  binaries:
    name: Binaries ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build static binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          mkdir -p out
          for cmd in thaimaturgy-server thaimaturgy-bot thaimaturgy-novel; do
            go build -trimpath -ldflags "${LDFLAGS}" -o "out/${cmd}${ext}" "./cmd/${cmd}"
          done
      - name: Package + checksum
        run: |
          set -euo pipefail
          pkg="thaimaturgy_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd out && zip -q "../dist/${pkg}.zip" ./*)
          else
            tar -C out -czf "dist/${pkg}.tar.gz" .
          fi
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # --- desktop GUI (CGO/Fyne) on native runners ----------------------------
  gui:
    name: GUI ${{ matrix.goos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, arch: amd64, ext: '' }
          - { os: macos-latest, goos: darwin, arch: arm64, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Linux GUI build deps
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build the desktop GUI
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p out
          go build -trimpath -ldflags "${LDFLAGS}" -o "out/thaimaturgy${{ matrix.ext }}" ./cmd/thaimaturgy
      - name: Package + checksum
        run: |
          set -euo pipefail
          pkg="thaimaturgy-gui_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.arch }}"
          mkdir -p dist
          tar -C out -czf "dist/${pkg}.tar.gz" .
          (cd dist && for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  # --- multi-arch Docker images to GHCR ------------------------------------
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: thaimaturgy-server, dockerfile: Dockerfile }
          - { image: thaimaturgy-server-claude, dockerfile: Dockerfile.claude-cli }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # --- GitHub Release with all binary artifacts ----------------------------
  release:
    name: GitHub Release
    needs: [binaries, gui, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
