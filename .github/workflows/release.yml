name: Release

# Publishes versioned artifacts when a semver tag (vX.Y.Z) is pushed:
#   - static binaries (server, bot, novel) for linux/darwin/windows × amd64/arm64,
#     attached to a GitHub Release with SHA-256 checksums;
#   - the desktop GUI (CGO/Fyne) for linux + macOS, built on native runners;
#   - multi-arch Docker images (default + claude-cli) pushed to GHCR.
#
# The version comes from the tag; `prepare` validates it is strict semver and
# decides which moving tags to update (see below). Everyday build+test lives in
# ci.yml; this workflow only runs for tags. Cut a release with:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Moving-tag policy (avoids an out-of-order run clobbering a newer release):
#   X.Y.Z  -> always (immutable, incl. prereleases like v1.2.3-rc1)
#   X.Y    -> only for STABLE releases (no prerelease suffix)
#   latest -> only when this tag is the HIGHEST stable semver in the repo
# Releases are also serialized (concurrency) so two runs never overlap.
#
# NOTE: the Windows desktop GUI is not built here (Fyne needs a mingw toolchain on
# the Windows runner); Windows users get the static binaries. A Windows GUI build
# (fyne-cross or a mingw setup) can follow.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read # least privilege by default; jobs elevate as needed

# No workflow-wide concurrency group: a single group keeps only one pending run,
# so a burst of tags could cancel a middle release before it publishes its
# immutable artifacts. Instead, moving-tag safety is order-independent — `prepare`
# decides latest/X.Y by comparing THIS tag against all tags in the repo, so a
# stale run never promotes itself regardless of finish order.

env:
  GO_VERSION: '1.25'

jobs:
  # --- validate the tag and decide moving-tag policy -----------------------
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_stable: ${{ steps.v.outputs.is_stable }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      is_latest_minor: ${{ steps.v.outputs.is_latest_minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to compare against the whole release history
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Strict SemVer (semver.org grammar, capturing-group ERE for bash =~):
          # rejects e.g. v1.2 / v1.2.3-01, accepts v1.2.3 / v1.2.3-rc.1 / v1.2.3+build.
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$VERSION" =~ $re ]]; then
            echo "::error::tag '$VERSION' is not valid SemVer (vMAJOR.MINOR.PATCH[-prerelease][+build]); refusing to publish"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          core="${VERSION%%+*}" # drop +build metadata before judging prerelease
          case "$core" in *-*) is_stable=false ;; *) is_stable=true ;; esac
          is_latest=false
          is_latest_minor=false
          if [ "$is_stable" = "true" ]; then
            # Stable release tags only (prereleases dropped), compared build-agnostically.
            # Order-independent: an older tag pushed later sees the newer tag here and
            # correctly declines to promote latest / X.Y.
            stable="$(git tag -l 'v*.*.*' | while read -r t; do c="${t%%+*}"; case "$c" in *-*) : ;; *) echo "$c" ;; esac; done | sort -V -u)"
            [ "$(printf '%s\n' "$stable" | tail -1)" = "$core" ] && is_latest=true
            mm="${core%.*}"; mm_esc="${mm//./\\.}"
            [ "$(printf '%s\n' "$stable" | grep -E "^${mm_esc}\." | sort -V | tail -1)" = "$core" ] && is_latest_minor=true
          fi
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "is_latest_minor=$is_latest_minor" >> "$GITHUB_OUTPUT"

  # --- static CLI/server binaries (cross-compiled, CGO-free) ---------------
  binaries:
    name: Binaries ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build static binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          mkdir -p out
          for cmd in thaimaturgy-server thaimaturgy-bot thaimaturgy-novel; do
            go build -trimpath -ldflags "${LDFLAGS}" -o "out/${cmd}${ext}" "./cmd/${cmd}"
          done
      - name: Package + checksum
        run: |
          set -euo pipefail
          pkg="thaimaturgy_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd out && zip -q "../dist/${pkg}.zip" ./*)
          else
            tar -C out -czf "dist/${pkg}.tar.gz" .
          fi
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # --- desktop GUI (CGO/Fyne) on native runners ----------------------------
  gui:
    name: GUI ${{ matrix.goos }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, arch: amd64 }
          - { os: macos-latest, goos: darwin, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Linux GUI build deps
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build the desktop GUI
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p out
          go build -trimpath -ldflags "${LDFLAGS}" -o "out/thaimaturgy" ./cmd/thaimaturgy
      - name: Package + checksum
        run: |
          set -euo pipefail
          pkg="thaimaturgy-gui_${VERSION}_${{ matrix.goos }}_${{ matrix.arch }}"
          mkdir -p dist
          tar -C out -czf "dist/${pkg}.tar.gz" .
          (cd dist && for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.goos }}
          path: dist/*
          if-no-files-found: error

  # --- multi-arch Docker images to GHCR ------------------------------------
  images:
    name: Image ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: thaimaturgy-server, dockerfile: Dockerfile }
          - { image: thaimaturgy-server-claude, dockerfile: Dockerfile.claude-cli }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # latest=false: don't let metadata-action auto-tag `latest` for every
          # semver — only the explicitly guarded raw entry below may set it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.is_latest_minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_latest == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  # --- GitHub Release with all binary artifacts ----------------------------
  release:
    name: GitHub Release
    needs: [prepare, binaries, gui, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.is_stable != 'true' }}
